<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Cobra 3D · AO VIVO — Overlay</title>
  <!-- Three.js served from node_modules (SPEC §0). No CDN, no Google Fonts: the overlay works offline inside OBS. -->
  <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
  <link rel="stylesheet" href="/css/overlay.css">
  <link rel="stylesheet" href="/css/alerts.css"><!-- [monet] alertas + metas de monetização -->
</head>
<body>
  <!-- [layout] #safe is the LOCKED 9:16 STAGE. Everything the viewer sees lives inside it, so the
       composition is identical in any window (letterbox/pillarbox around it, like a video player).
       See overlay.css "PALCO 9:16" and main.js sizeStage(). -->
  <div id="safe" class="safe">
    <!-- 3D stage: the renderer appends its canvas here (SPEC §7). Sized by #safe, not by the window. -->
    <div id="stage" aria-hidden="true"></div>

    <!-- HUD skeleton: hud.js fills each band (SPEC §8). Band ids are reused by createHud().
         [live-real] PRIORIDADE VERTICAL INVERTIDA (2026-09-05, print de uma live real): o chat do
         TikTok sobe pela tela e cobre tudo abaixo de ~70 %, então o essencial mora ACIMA do
         tabuleiro. Mapa vertical (frações do PALCO):
           0–11 %   zona morta (barra do TikTok: foto, Seguir, contagem, X) — vazia
           11–30 %  BLOCO PRINCIPAL: placar, DUELO VILÕES × HERÓIS, carrossel de metas, progresso
           30–71 %  tabuleiro (a estrela) — só sobreposições transitórias
           71–79 %  TABELA DE PRESENTES (#hud-guide) — o que ensina 🌹 = 💣 e 🎮 = 🍎
           79–100 % zona morta (chat e barra de presentes do TikTok) — só o trilho de chat local -->
    <div id="hud" class="hud" aria-live="polite">
      <header id="hud-top" class="band band-top"></header>
      <!-- Bloco principal, ladrilhado de cima para baixo: placar, duelo, carrossel; a barra de
           status e o progresso ficam no flow de #hud-score, embaixo dos três. -->
      <section id="hud-scoreboard" class="band band-scoreboard"></section>
      <section id="hud-leader" class="band band-leader"></section>
      <section id="hud-money" class="band band-money" aria-label="Metas e ranking"></section>
      <section id="hud-score" class="band band-score"></section>
      <section id="hud-board" class="band band-board"></section>
      <!-- [layout] Trilho de chat na zona morta: é o único conteúdo descartável do overlay. -->
      <section id="hud-chat" class="band band-chat"></section>
      <div id="hud-confetti" class="confetti hidden"></div>
    </div>

    <!-- [layout] ?safezone=1 debug guides (main.js fills this). -->
    <div id="safezone" class="safezone hidden" aria-hidden="true"></div>
  </div>

  <!-- Dev mini-panel (hidden with ?obs=1). Buttons call the sim API; main.js wires them. -->
  <aside id="devpanel" aria-label="Painel de desenvolvimento">
    <div class="dev-title">Dev · simular</div>
    <button type="button" data-action="gift:rose" title="Vilão 1🪙: 1 bomba">🌹 Rosa<kbd>3</kbd></button>
    <button type="button" data-action="gift:donut" title="Vilão 30🪙: 3 bombas + raio">🍩 Rosquinha</button>
    <button type="button" data-action="gift:confetti" title="Vilão 100🪙: 8 bombas + gelo + teia">🎊 Confete<kbd>4</kbd></button>
    <button type="button" data-action="gift:gg" title="Herói 1🪙: +1 comida dourada">🎮 GG<kbd>5</kbd></button>
    <button type="button" data-action="gift:heart" title="Herói 30🪙: cresce +3 e diamante">🫰 Coração</button>
    <button type="button" data-action="gift:hands" title="Herói 100🪙: limpa bombas + escudo 30s">🫶 Mãozinha<kbd>6</kbd></button>
    <button type="button" data-action="chat" title="Simular mensagem no chat">💬 Chat</button>
    <button type="button" data-action="like" title="Simular curtidas">❤️ Like</button>
    <button type="button" data-action="follow" title="Simular novo seguidor">➕ Seguir</button>
    <!-- [monet] alertas de engajamento -->
    <button type="button" data-action="share" title="Simular compartilhamento">🔁 Compartilhar</button>
    <button type="button" data-action="member" title="Simular entrada de uma pessoa">👋 Entrou</button>
    <button type="button" data-action="member:many" title="Simular 12 entradas (testa o agrupamento)">👥 Entrou ×12</button>
    <button type="button" data-action="apple" title="Garantir uma maçã no tabuleiro">🍎 Maçã<kbd>1</kbd></button>
    <button type="button" data-action="bomb" title="Soltar uma bomba local">💣 Bomba<kbd>2</kbd></button>
    <!-- [itens] itens especiais: 4 de dano + 4 de bônus -->
    <button type="button" data-action="item:bolt" title="Dano: raio (encolhe muito, pavio curto)">⚡ Raio</button>
    <button type="button" data-action="item:ice" title="Dano: gelo (deixa a cobra lenta)">🧊 Gelo</button>
    <button type="button" data-action="item:web" title="Dano: teia (prende a cobra)">🕸️ Teia</button>
    <button type="button" data-action="item:skull" title="Dano: caveira (dano pesado)">☠️ Caveira</button>
    <button type="button" data-action="item:diamond" title="Bônus: diamante (cresce +5)">💎 Diamante</button>
    <button type="button" data-action="item:star" title="Bônus: estrela (invencível)">⭐ Estrela</button>
    <button type="button" data-action="item:magnet" title="Bônus: ímã (atrai as comidas)">🧲 Ímã</button>
    <button type="button" data-action="item:clock" title="Bônus: relógio (deixa a cobra rápida)">⏱️ Relógio</button>
    <button type="button" data-action="new_round" title="Nova rodada">🔄 Nova rodada<kbd>N</kbd></button>
    <button type="button" data-action="pause" title="Pausar / retomar">⏯ Pausar<kbd>P</kbd></button>
    <button type="button" data-action="hud" title="Mostrar / esconder HUD">👁 HUD<kbd>H</kbd></button>
    <button type="button" data-action="audio" title="Som ligado / desligado">🔊 Som</button>
    <div class="dev-status" id="dev-status">iniciando…</div>
  </aside>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
